<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portfolio OS</title>

  <!-- Meta PWA & Plein écran iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfolio OS">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Icônes pour l'écran d'accueil iOS et le Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" sizes="180x180" href="icon.png">
  <link rel="shortcut icon" href="icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
      -webkit-tap-highlight-color: transparent;
    }
    #portfolio-frame {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Hauteur dynamique plein écran iOS Safari */
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    id="portfolio-frame" 
    src="VOTRE_URL_GOOGLE_APPS_SCRIPT" 
    allow="autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media" 
    sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals">
  </iframe>
</body>
</html>
