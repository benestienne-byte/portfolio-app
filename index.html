<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfolio OS">
  <meta name="theme-color" content="#050505">
  <title>Portfolio OS</title>

  <link rel="icon" type="image/png" href="https://benestienne-byte.github.io/portfolio-app/icon.png">
  <link rel="apple-touch-icon" href="https://benestienne-byte.github.io/portfolio-app/icon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050505; /* Gère la couleur sous l'encoche et la barre du bas */
      overflow: hidden;
    }
    
    /* La "boîte" qui absorbe les encoches d'Apple et protège l'iframe */
    .safe-area-wrapper {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
      background-color: #050505;
    }
  </style>
</head>
<body>
  <div class="safe-area-wrapper">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbwjs7UeP1aBsHPsFXm-S2KCFjAhy4D43bPFTqekaTF12upd3zdTBsOg9FDw65nWbmwRFQ/exec" 
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>
</body>
</html>
