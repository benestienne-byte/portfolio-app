<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portfolio OS</title>

  <!-- PWA & Plein écran iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfolio OS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050505">

  <!-- Icônes pour l'écran d'accueil iOS et Favicon -->
  <link rel="icon" type="image/png" href="https://benestienne-byte.github.io/portfolio-app/icon.png">
  <link rel="apple-touch-icon" href="https://benestienne-byte.github.io/portfolio-app/icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    /* Verrouille l'écran complet sur iOS sans défilement élastique */
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #050505;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Boîte qui protège l'iframe sous la Dynamic Island et la barre d'accueil */
    .safe-area-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: #050505;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      flex: 1;
      display: block;
      background-color: #050505;
    }
  </style>
</head>
<body>
  <div class="safe-area-wrapper">
    <iframe 
      id="portfolio-frame"
      src="https://script.google.com/macros/s/AKfycbwjs7UeP1aBsHPsFXm-S2KCFjAhy4D43bPFTqekaTF12upd3zdTBsOg9FDw65nWbmwRFQ/exec" 
      allow="clipboard-read; clipboard-write; autoplay; fullscreen"
      sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals">
    </iframe>
  </div>
</body>
</html>
